<head>

    <link href="snow.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Raleway:400,400i,700" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="http://code.jquery.com/ui/1.12.0/jquery-ui.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    

    

    <div class="updates">
    <div class="accountinfo">
    <img class="discordpfp" src="https://cdn.discordapp.com/icons/1200566506719817868/ece607bb69196b4bce2bc079fd610462.webp" onerror="this.src='https://cdn.discordapp.com/attachments/1383526587403862058/1384939262306422937/bg.jpg?ex=685440b3&is=6852ef33&hm=ad1d5a06bafd3a3b5d472e55e3eaab927e5d2367bccec52c3bd2e7fe591ee0da&'">
    <h2><span><span class="info">VICE</span></h2>
    </div>
    <audio id="leson" src="music.mp3" autoplay="false" hidden="true" loop="true"/>
    
    <script>

    var play = false;
    var myAudio = document.getElementById("leson");
    
    myAudio.volume = 0.4;

    function onKeyDown(event) {
            switch (event.keyCode) {
                case 32: //SpaceBar                    
                    if (play) {
                        myAudio.pause();
                        play = false;
                    } else {
                        myAudio.play();
                        play = true;
                    }
                    break;
            }
      return false;
    }

    window.addEventListener("keydown", onKeyDown, false);
    </script>

    <div class="progress"></div>

</body>
</html>
